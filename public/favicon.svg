<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emeraldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer glow ring -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="url(#goldGradient)" stroke-width="2" opacity="0.6"/>
  <circle cx="32" cy="32" r="28" fill="none" stroke="url(#emeraldGradient)" stroke-width="1" opacity="0.4"/>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="26" fill="#062d1f"/>

  <!-- Subtle pattern -->
  <g opacity="0.05" fill="url(#goldGradient)">
    <circle cx="16" cy="16" r="3"/>
    <circle cx="48" cy="48" r="3"/>
    <circle cx="16" cy="48" r="2"/>
    <circle cx="48" cy="16" r="2"/>
  </g>

  <!-- Central Arabic letter "ص" -->
  <text x="32" y="40" text-anchor="middle" font-family="Amiri, Amiri Quran, serif" font-size="36" font-weight="700" fill="url(#goldGradient)">ص</text>

  <!-- Inner accent ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.5"/>

  <!-- Small decorative dots -->
  <g fill="url(#goldGradient)" opacity="0.8">
    <circle cx="32" cy="8" r="1.5"/>
    <circle cx="32" cy="56" r="1.5"/>
    <circle cx="8" cy="32" r="1.5"/>
    <circle cx="56" cy="32" r="1.5"/>
  </g>
</svg>